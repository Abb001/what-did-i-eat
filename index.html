<style>
  :root{
    --paper:#F6F7F4; --card:#FFFFFF; --wash:#EAECE8; --line:rgba(123,132,124,.22);
    --ink:#1B1E22; --mid:#5E646C; --soft:#9AA0A6;
    --blue:#2F5D8A; --blue-wash:#E9F0F7;
    --glass:rgba(255,255,255,.63); --glass-strong:rgba(255,255,255,.78);
    --glass-edge:rgba(255,255,255,.88); --glass-shadow:0 16px 34px rgba(39,48,43,.09),0 2px 7px rgba(39,48,43,.05);
    --g:'Familjen Grotesk', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:
    radial-gradient(ellipse 110% 48% at 50% -14%,rgba(255,255,255,.96),transparent 70%),
    linear-gradient(145deg,#EEF2F0 0%,var(--paper) 48%,#F8F8F6 100%);
    color:var(--ink);font-family:var(--g);-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;
    padding:calc(26px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom))}

  .view[hidden]{display:none}
  .view{animation:in .26s cubic-bezier(.32,.72,0,1)}
  @keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:relative;margin:-8px -8px 0;padding:13px 12px;border-radius:22px;
    background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:blur(22px) saturate(145%);backdrop-filter:blur(22px) saturate(145%)}
  .month{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
  .month .yr{font-size:16px;font-weight:400;color:var(--soft);margin-left:10px;letter-spacing:0}
  .nav{display:flex;gap:8px}
  .nav button{width:38px;height:38px;border:1px solid var(--glass-edge);background:rgba(255,255,255,.58);color:var(--mid);
    border-radius:50%;cursor:pointer;font-size:16px;line-height:1;box-shadow:0 2px 6px rgba(34,42,37,.07);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .15s ease,border-color .15s,color .15s}
  .nav button:active{border-color:var(--soft);color:var(--ink);transform:scale(.92)}
  .nav button:disabled{opacity:.3}

  .tally{display:flex;align-items:center;gap:12px;margin:22px 0 20px;padding:10px 12px;border-radius:16px;
    background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.62)}
  .tally span{font-size:14px;color:var(--mid);white-space:nowrap}
  .bar{flex:1;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}

  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:9px}
  .dow span{font-size:13px;color:var(--soft);text-align:center;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
  .cell{aspect-ratio:1;border-radius:11px;position:relative;background:rgba(234,236,232,.76);border:1px solid rgba(255,255,255,.5);
    cursor:pointer;overflow:hidden;padding:0;background-size:cover;background-position:center;
    box-shadow:inset 0 1px rgba(255,255,255,.52);transition:transform .12s ease,box-shadow .12s ease}
  .cell.pad{background:none;pointer-events:none}
  .cell:not(.pad):active{transform:scale(.94)}
  .cell.has::after{content:'';position:absolute;inset:0;
    background:linear-gradient(to top,rgba(20,22,25,.62),rgba(20,22,25,0) 58%)}
  .cell.future{opacity:.45}
  .cell b{position:absolute;left:7px;bottom:5px;z-index:2;font-weight:500;font-size:14px;color:var(--soft)}
  .cell.has b{color:#fff;font-weight:600}
  .cell.today{box-shadow:inset 0 0 0 2px var(--blue),0 3px 8px rgba(47,93,138,.13)}
  .cell.today:not(.has){background:var(--blue-wash)}
  .cell.today:not(.has) b{color:var(--blue)}
  .cell .n{position:absolute;right:6px;top:5px;z-index:2;font-weight:500;font-size:12px;color:#fff}

  .legend{margin-top:24px;font-size:13.5px;color:var(--soft);line-height:1.9}
  .foot{margin-top:28px;padding:16px;border:1px solid var(--glass-edge);border-radius:18px;background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(135%);backdrop-filter:blur(18px) saturate(135%);box-shadow:0 8px 22px rgba(39,48,43,.05);
    display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .foot button{background:none;border:none;font-family:var(--g);font-size:13px;color:var(--soft);
    cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  .foot small{font-size:12px;color:#B6BBBF;margin-left:auto}

  .back{background:var(--glass);border:1px solid var(--glass-edge);border-radius:99px;color:var(--mid);font-family:var(--g);font-size:15px;
    cursor:pointer;padding:9px 14px;margin-bottom:24px;box-shadow:0 4px 12px rgba(39,48,43,.06);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .dhead{display:flex;align-items:center;gap:16px;margin-bottom:26px}
  .dnum{font-size:52px;font-weight:600;line-height:.9;letter-spacing:-.03em}
  .dmeta{font-size:14px;color:var(--mid);line-height:1.8}
  .dmeta em{font-style:normal;color:var(--blue)}

  .shots{display:flex;flex-direction:column;gap:18px}
  .shot{border:1px solid var(--glass-edge);border-radius:18px;overflow:hidden;background:var(--glass);
    box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(22px) saturate(145%);backdrop-filter:blur(22px) saturate(145%)}
  .shot img{width:100%;height:auto;display:block}
  .shotbar{display:flex;align-items:center;gap:8px;padding:12px 13px;flex-wrap:wrap}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-family:var(--g);font-size:13px;padding:7px 13px;border-radius:99px;
    border:1px solid rgba(255,255,255,.86);background:rgba(255,255,255,.55);color:var(--mid);cursor:pointer;line-height:1.3;
    box-shadow:0 2px 5px rgba(34,42,37,.05);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .tag.on{border-color:var(--blue);background:var(--blue-wash);color:var(--blue)}
  .spacer{margin-left:auto}
  .time-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:120px}
  .time-type,.vague,input.time{font-family:var(--g);font-size:13px;color:var(--mid);background:var(--card);
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;-webkit-appearance:none;appearance:none;
    min-width:88px;text-align:center}
  .time-type{min-width:100px}
  .vague{text-align:left;min-width:120px}
  .shot.text-only{background:rgba(241,242,238,.88)}
  .no-photo{min-height:170px;display:grid;place-items:center;border-bottom:1px solid var(--line);
    background:rgba(241,242,238,.7);color:var(--soft);font-size:14px;text-align:center;padding:28px}
  .actions{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .action-btn{background:var(--glass);border:1px solid var(--glass-edge);border-radius:99px;color:var(--ink);
    padding:11px 16px;font-family:var(--g);font-size:14px;cursor:pointer;box-shadow:0 4px 11px rgba(39,48,43,.06);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .action-btn:active{background:var(--wash)}
  input.time:focus, .time-type:focus, .vague:focus{border-color:var(--blue);outline:none}
  .icon{background:rgba(255,255,255,.55);border:1px solid var(--glass-edge);color:var(--mid);cursor:pointer;
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;padding:0;box-shadow:0 2px 5px rgba(34,42,37,.05);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .icon svg{width:16px;height:16px;display:block}
  .icon:active{border-color:var(--soft);color:var(--ink)}
  .icon.danger:active{color:#B4544A;border-color:#B4544A}
  .note{width:100%;border:none;border-top:1px solid var(--line);background:transparent;color:var(--ink);
    font-family:var(--g);font-size:16px;line-height:1.7;padding:13px;resize:none;outline:none;
    display:block;overflow:hidden}
  .note::placeholder{color:#B6BBBF}

  .empty{border:1px dashed rgba(123,132,124,.3);border-radius:18px;padding:48px 24px;text-align:center;
    color:var(--soft);font-size:15px;line-height:1.9;background:rgba(255,255,255,.31);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

  .add{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(26px + env(safe-area-inset-bottom));z-index:20;
    background:rgba(27,30,34,.86);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:15px 30px;
    font-family:var(--g);font-size:15px;font-weight:500;cursor:pointer;
    box-shadow:0 9px 26px rgba(27,30,34,.24),inset 0 1px rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
  .add[hidden]{display:none}
  .add.busy{opacity:.55;pointer-events:none}
  input[type=file]{display:none}

  /* ---------- autosave pill ---------- */
  .saved{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-14px);
    z-index:80;background:rgba(27,30,34,.92);color:#fff;font-size:13px;font-weight:500;
    padding:8px 16px;border-radius:99px;pointer-events:none;opacity:0;
    transition:opacity .22s ease, transform .22s ease;display:flex;align-items:center;gap:7px}
  .saved.show{opacity:1;transform:translate(-50%,0)}
  .saved i{width:6px;height:6px;border-radius:50%;background:#8FD0A4;display:block}
  .saved.working i{background:#E8C468}

  /* ---------- photo editor ---------- */
  .editor{position:fixed;inset:0;z-index:60;background:#141618;display:flex;flex-direction:column;
    color:#EDEEEF;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .editor[hidden]{display:none}
  .ebar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex:0 0 auto}
  .ebar span{font-size:14px;color:#9BA1A6}
  .ebar button{background:none;border:none;font-family:var(--g);font-size:15px;cursor:pointer;padding:6px 2px}
  #eCancel{color:#9BA1A6}
  #eSave{color:#7FB2E8;font-weight:600}
  .stage{flex:1 1 auto;display:grid;place-items:center;overflow:hidden;padding:10px 18px}
  .cbox{position:relative;overflow:hidden;touch-action:none;user-select:none}
  .cbox img{position:absolute;left:50%;top:50%;transform-origin:center center;pointer-events:none}
  .crop{position:absolute;box-shadow:0 0 0 9999px rgba(10,12,13,.62);
    outline:1px solid rgba(255,255,255,.9);cursor:move}
  .crop .thirds{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .18s;
    background:
      linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.3) 33.2%,rgba(255,255,255,.3) 33.5%,transparent 33.5%,transparent 66.4%,rgba(255,255,255,.3) 66.4%,rgba(255,255,255,.3) 66.7%,transparent 66.7%),
      linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.3) 33.2%,rgba(255,255,255,.3) 33.5%,transparent 33.5%,transparent 66.4%,rgba(255,255,255,.3) 66.4%,rgba(255,255,255,.3) 66.7%,transparent 66.7%)}
  .crop.active .thirds{opacity:1}
  .hh{position:absolute;width:22px;height:22px;border:3px solid #fff;touch-action:none}
  .hh::after{content:'';position:absolute;inset:-14px}
  .hh[data-h=nw]{left:-3px;top:-3px;border-right:none;border-bottom:none;cursor:nwse-resize}
  .hh[data-h=ne]{right:-3px;top:-3px;border-left:none;border-bottom:none;cursor:nesw-resize}
  .hh[data-h=sw]{left:-3px;bottom:-3px;border-right:none;border-top:none;cursor:nesw-resize}
  .hh[data-h=se]{right:-3px;bottom:-3px;border-left:none;border-top:none;cursor:nwse-resize}

  .ectrl{flex:0 0 auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:14px}
  .ratios{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .ratios button{font-family:var(--g);font-size:13px;padding:7px 14px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(255,255,255,.2);background:transparent;color:#9BA1A6}
  .ratios button.on{border-color:#7FB2E8;color:#7FB2E8;background:rgba(127,178,232,.12)}
  .rots{display:flex;gap:12px;justify-content:center}
  .rots button{width:46px;height:42px;border-radius:10px;cursor:pointer;font-size:18px;
    border:1px solid rgba(255,255,255,.2);background:transparent;color:#EDEEEF;display:grid;place-items:center}
  .rots button:active{background:rgba(255,255,255,.1)}

  .loading{text-align:center;color:var(--soft);font-size:14px;padding:64px 0}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .editor button:focus-visible{outline-color:#7FB2E8}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="saved" id="savedPill"><i></i><span id="savedTxt">Autosaved</span></div>

<div class="wrap">
  <div class="view" id="cal">
    <div class="top">
      <div class="month" id="mTitle">—</div>
      <div class="nav">
        <button id="prev" aria-label="Previous month">←</button>
        <button id="next" aria-label="Next month">→</button>
      </div>
    </div>
    <div class="tally"><span id="tallyTxt">Loading</span><span class="bar"><i id="tallyBar" style="width:0"></i></span></div>
    <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">Logged days show the first photo from that day.<br>Tap any day to view it or add photos.</div>
    <div class="foot">
      <button id="exportBtn">Export backup</button>
      <button id="importBtn">Restore backup</button>
      <small id="mode"></small>
    </div>
  </div>

  <div class="view" id="sheet" hidden>
    <button class="back" id="back">← Back to calendar</button>
    <div class="dhead"><div class="dnum" id="dNum">—</div><div class="dmeta" id="dMeta"></div></div>
    <div class="actions"><button class="action-btn" id="addNoteBtn">＋ Add note</button></div>
    <div id="dBody" class="loading">Loading</div>
  </div>
</div>

<button class="add" id="addBtn" hidden>＋ Add photo</button>
<input type="file" id="file" accept="image/*" multiple>
<input type="file" id="restore" accept="application/json,.json">

<div class="editor" id="editor" hidden>
  <div class="ebar">
    <button id="eCancel">Cancel</button>
    <span>Crop &amp; rotate</span>
    <button id="eSave">Done</button>
  </div>
  <div class="stage" id="stage">
    <div class="cbox" id="cbox">
      <img id="eImg" alt="">
      <div class="crop" id="crop">
        <div class="thirds"></div>
        <div class="hh" data-h="nw"></div><div class="hh" data-h="ne"></div>
        <div class="hh" data-h="sw"></div><div class="hh" data-h="se"></div>
      </div>
    </div>
  </div>
  <div class="ectrl">
    <div class="ratios" id="ratios">
      <button data-ar="0">Freeform</button>
      <button data-ar="1">Square</button>
      <button data-ar="0.8">4:5</button>
      <button data-ar="1.5">3:2</button>
      <button data-ar="-1">Original</button>
    </div>
    <div class="rots">
      <button id="rotL" aria-label="Rotate left">⟲</button>
      <button id="reset" aria-label="Reset crop" style="width:auto;padding:0 16px;font-size:14px">Reset</button>
      <button id="rotR" aria-label="Rotate right">⟳</button>
    </div>
  </div>
</div>

<script>
const MEALS = ['Breakfast','Lunch','Dinner','Snack','Late night'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const CROSS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

/* ---------- storage ---------- */
let dbp = null;
function openDB(){
  if(dbp) return dbp;
  dbp = new Promise((res,rej)=>{
    const r = indexedDB.open('meals-diary', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function idbTx(mode, fn){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction('kv', mode);
    const req = fn(tx.objectStore('kv'));
    tx.onerror = () => rej(tx.error);
    if(req) req.onsuccess = () => res(req.result);
    else tx.oncomplete = () => res();
  });
}
const idbStore = {
  get: k => idbTx('readonly', s => s.get(k)).then(v => v ?? null),
  set: (k,v) => idbTx('readwrite', s => s.put(v, k)),
  keys: () => idbTx('readonly', s => s.getAllKeys())
};
let store = idbStore, backend = 'this device';
if(window.storage && typeof window.storage.get === 'function'){
  store = {
    async get(k){ try{ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
                  catch(e){ return null; } },
    set: (k,v) => window.storage.set(k, JSON.stringify(v)),
    async keys(){ try{ const r = await window.storage.list(''); return r ? r.keys : []; }catch(e){ return []; } }
  };
  backend = 'Claude storage';
}

const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = key(new Date());
const $ = id => document.getElementById(id);

let view = new Date(); view.setDate(1);
let monthIdx = {}, openDay = null, openPhotos = [];

/* ---------- autosave feedback ---------- */
let pillTimer = null;
function pill(text, working){
  const p = $('savedPill');
  $('savedTxt').textContent = text;
  p.classList.toggle('working', !!working);
  p.classList.add('show');
  clearTimeout(pillTimer);
  if(!working) pillTimer = setTimeout(()=>p.classList.remove('show'), 1700);
}

/* ---------- image helpers ---------- */
function loadImg(src){
  return new Promise((res,rej)=>{
    const i = new Image();
    i.onload = ()=>res(i); i.onerror = rej; i.src = src;
  });
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function downscale(img, max, q){
  const s = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', q);
}
async function makeThumb(src){ return downscale(await loadImg(src), 170, .55); }

/* ---------- month index ---------- */
async function reconcile(mk, idx){
  const days = Object.keys(idx);
  if(!days.length) return idx;
  let changed = false;
  const y = mk.slice(6,10), m = mk.slice(11,13);
  await Promise.all(days.map(async dd => {
    const photos = await store.get(`day:${y}-${m}-${dd}`);
    if(!photos || !photos.length){ delete idx[dd]; changed = true; return; }
    if(idx[dd].n !== photos.length || idx[dd].thumb !== photos[0].thumb){
      idx[dd] = { n: photos.length, thumb: photos[0].thumb }; changed = true;
    }
  }));
  if(changed) await store.set(mk, idx);
  return idx;
}

async function loadMonth(){
  const mk = `month:${view.getFullYear()}-${pad(view.getMonth()+1)}`;
  monthIdx = (await store.get(mk)) || {};
  drawMonth();
  monthIdx = await reconcile(mk, monthIdx);
  drawMonth();
}

function drawMonth(){
  const y = view.getFullYear(), m = view.getMonth();
  $('mTitle').innerHTML = `${MONTHS[m]}<span class="yr">${y}</span>`;
  const lead = (new Date(y,m,1).getDay()+6)%7;
  const days = new Date(y,m+1,0).getDate();
  const now = new Date(); now.setHours(0,0,0,0);

  let html = '';
  for(let i=0;i<lead;i++) html += '<div class="cell pad"></div>';
  let done = 0, elapsed = 0;
  for(let d=1;d<=days;d++){
    const dk = `${y}-${pad(m+1)}-${pad(d)}`;
    const rec = monthIdx[pad(d)];
    const has = rec && rec.n > 0;
    const future = new Date(y,m,d) > now;
    if(!future) elapsed++;
    if(has) done++;
    const cls = ['cell', has?'has':'', dk===todayKey?'today':'', future?'future':''].join(' ');
    const bg = has && rec.thumb ? `background-image:url(${rec.thumb})` : '';
    html += `<button class="${cls}" style="${bg}" data-d="${dk}" ${future?'disabled':''}>
               ${has && rec.n>1 ? `<span class="n">${rec.n}</span>`:''}<b>${d}</b></button>`;
  }
  $('grid').innerHTML = html;

  const isThis = y===now.getFullYear() && m===now.getMonth();
  const total = isThis ? elapsed : days;
  $('tallyTxt').textContent = `${done} of ${total} days logged`;
  $('tallyBar').style.width = total ? (done/total*100)+'%' : '0';
  $('next').disabled = (y>now.getFullYear()) || (y===now.getFullYear() && m>=now.getMonth());
  document.querySelectorAll('.cell[data-d]').forEach(b=>b.onclick=()=>showDay(b.dataset.d));
}

/* ---------- day view ---------- */
async function showDay(dk){
  openDay = dk;
  const [y,m,d] = dk.split('-').map(Number);
  $('dNum').textContent = d;
  $('dMeta').innerHTML = `${MONTHS[m-1]} ${y}<br>${WD[new Date(y,m-1,d).getDay()]}${dk===todayKey?' · <em>Today</em>':''}`;
  $('cal').hidden = true; $('sheet').hidden = false;
  window.scrollTo(0,0);
  $('dBody').className = 'loading'; $('dBody').textContent = 'Loading';
  $('addBtn').hidden = false;
  openPhotos = (await store.get(`day:${dk}`)) || [];
  drawDay();
}

function autosize(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }
function byTime(a,b){
  const aType = a.timeType || 'detail';
  const bType = b.timeType || 'detail';
  if(aType !== bType) return aType === 'detail' ? -1 : 1;
  return (a.time||'').localeCompare(b.time||'');
}

function drawDay(){
  const el = $('dBody');
  el.className = '';
  if(!openPhotos.length){
    el.innerHTML = `<div class="empty">Nothing logged this day.<br>Add a photo to fill it in.</div>`;
    return;
  }
  el.innerHTML = `<div class="shots">` + openPhotos.map((p,i)=>{
    const hasPhoto = !!p.src;
    const order = p.meal ? [p.meal, ...MEALS.filter(t=>t!==p.meal)] : MEALS;
    const timeType = p.timeType || 'detail';
    const detailHidden = timeType === 'detail' ? '' : 'hidden';
    const vagueHidden = timeType === 'vague' ? '' : 'hidden';
    return `
    <div class="shot ${hasPhoto?'':'text-only'}">
      ${hasPhoto ? `<img src="${p.src}" alt="">` : `<div class="no-photo">Text-only entry</div>`}
      <div class="shotbar">
        <div class="tags">${order.map(t=>
          `<button class="tag ${p.meal===t?'on':''}" data-i="${i}" data-t="${t}">${t}</button>`).join('')}</div>
        <span class="spacer"></span>
        <div class="time-group">
          <select class="time-type" data-timetype="${i}" aria-label="Time type">
            <option value="detail"${timeType==='detail'?' selected':''}>Detail</option>
            <option value="vague"${timeType==='vague'?' selected':''}>Vague</option>
          </select>
          <input type="time" class="time" value="${timeType==='detail'?p.time||'':''}" data-time="${i}" aria-label="Time" ${detailHidden}>
          <input type="text" class="vague" value="${timeType==='vague'?p.time||'':''}" data-vague="${i}" aria-label="Vague time" placeholder="e.g. evening" ${vagueHidden}>
        </div>
        ${hasPhoto?`<button class="icon" data-edit="${i}" aria-label="Crop and rotate">${PENCIL}</button>`:''}
        <button class="icon danger" data-del="${i}" aria-label="Delete">${CROSS}</button>
      </div>
      <textarea class="note" rows="1" data-note="${i}" placeholder="What was it? Where?">${p.note||''}</textarea>
    </div>`;
  }).join('') + `</div>`;

  el.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{
    const p = openPhotos[b.dataset.i];
    p.meal = p.meal===b.dataset.t ? null : b.dataset.t;
    save(); drawDay();
  });
  el.querySelectorAll('[data-time]').forEach(inp=>{
    inp.onchange = ()=>{
      const p = openPhotos[inp.dataset.time];
      p.time = inp.value;
      p.timeType = 'detail';
      openPhotos.sort(byTime);
      save(); drawDay();
    };
  });
  el.querySelectorAll('.time-type').forEach(sel=>{
    sel.onchange = ()=>{
      const p = openPhotos[sel.dataset.timetype];
      p.timeType = sel.value;
      if(p.timeType === 'detail' && !p.time) p.time = '12:00';
      openPhotos.sort(byTime);
      save(); drawDay();
    };
  });
  el.querySelectorAll('[data-vague]').forEach(inp=>{
    inp.oninput = ()=>{ openPhotos[inp.dataset.vague].time = inp.value; };
    inp.onblur = save;
  });
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(+b.dataset.edit));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this photo?')) return;
    openPhotos.splice(+b.dataset.del,1); save(); drawDay();
  });
  el.querySelectorAll('.note').forEach(t=>{
    autosize(t);
    t.oninput=()=>{ openPhotos[t.dataset.note].note = t.value; autosize(t); };
    t.onblur=save;
  });
}

async function save(quiet){
  if(!openDay) return;
  const [y,m,dd] = openDay.split('-');
  await store.set(`day:${openDay}`, openPhotos);
  const mk = `month:${y}-${m}`;
  const idx = (await store.get(mk)) || {};
  if(openPhotos.length) idx[dd] = { n: openPhotos.length, thumb: openPhotos[0].thumb };
  else delete idx[dd];
  await store.set(mk, idx);
  if(`${y}-${m}` === `${view.getFullYear()}-${pad(view.getMonth()+1)}`){ monthIdx = idx; drawMonth(); }
  if(!quiet) pill('Autosaved');
}

/* ================= photo editor ================= */
const ed = { i:-1, img:null, rot:0, ar:0, W:0, H:0, rect:{x:0,y:0,w:0,h:0} };
const MINC = 44;

function effDims(){
  return ed.rot % 180 === 0
    ? { w: ed.img.width, h: ed.img.height }
    : { w: ed.img.height, h: ed.img.width };
}

/* size the displayed image box to fit the stage */
function layout(){
  const st = $('stage').getBoundingClientRect();
  const e = effDims();
  const k = Math.min((st.width-36)/e.w, (st.height-20)/e.h);
  ed.W = Math.round(e.w*k); ed.H = Math.round(e.h*k);
  const box = $('cbox');
  box.style.width = ed.W+'px'; box.style.height = ed.H+'px';
  const im = $('eImg');
  im.style.width = ed.img.width+'px';
  im.style.height = ed.img.height+'px';
  const scale = ed.rot % 180 === 0 ? ed.W/ed.img.width : ed.H/ed.img.width;
  im.style.transform = `translate(-50%,-50%) rotate(${ed.rot}deg) scale(${scale})`;
}

function clampRect(){
  const r = ed.rect;
  r.w = Math.max(MINC, Math.min(r.w, ed.W));
  r.h = Math.max(MINC, Math.min(r.h, ed.H));
  r.x = Math.max(0, Math.min(r.x, ed.W - r.w));
  r.y = Math.max(0, Math.min(r.y, ed.H - r.h));
}

function drawRect(){
  clampRect();
  const c = $('crop'), r = ed.rect;
  c.style.left = r.x+'px'; c.style.top = r.y+'px';
  c.style.width = r.w+'px'; c.style.height = r.h+'px';
}

/* fit the largest rect of ratio ar inside the image, centred */
function fitRatio(ar){
  let w = ed.W, h = w/ar;
  if(h > ed.H){ h = ed.H; w = h*ar; }
  ed.rect = { x:(ed.W-w)/2, y:(ed.H-h)/2, w, h };
}

function setAR(ar){
  ed.ar = ar;
  if(ar === -1) ed.rect = { x:0, y:0, w:ed.W, h:ed.H };
  else if(ar > 0) fitRatio(ar);
  drawRect();
  document.querySelectorAll('#ratios button').forEach(b=>
    b.classList.toggle('on', Number(b.dataset.ar) === ar));
}

async function openEditor(i){
  const p = openPhotos[i];
  ed.i = i;
  ed.img = await loadImg(p.orig || p.src);
  $('eImg').src = ed.img.src;
  ed.rot = p.edit ? p.edit.rot : 0;
  $('editor').hidden = false;
  layout();
  if(p.edit && p.edit.rw){
    ed.ar = p.edit.ar;
    ed.rect = { x:p.edit.rx*ed.W, y:p.edit.ry*ed.H, w:p.edit.rw*ed.W, h:p.edit.rh*ed.H };
    drawRect();
    document.querySelectorAll('#ratios button').forEach(b=>
      b.classList.toggle('on', Number(b.dataset.ar) === ed.ar));
  }else{
    setAR(0);
    ed.rect = { x:0, y:0, w:ed.W, h:ed.H };
    drawRect();
  }
}
function closeEditor(){ $('editor').hidden = true; ed.img = null; }

$('eCancel').onclick = closeEditor;
$('ratios').onclick = e => { const b = e.target.closest('button'); if(b) setAR(Number(b.dataset.ar)); };
$('reset').onclick = ()=>{ ed.rect = {x:0,y:0,w:ed.W,h:ed.H}; ed.ar = 0; drawRect();
  document.querySelectorAll('#ratios button').forEach(b=>b.classList.toggle('on', b.dataset.ar==='0')); };
function rotate(deg){
  ed.rot = (ed.rot + deg + 360) % 360;
  layout();
  setAR(ed.ar === -1 ? -1 : ed.ar);
  if(ed.ar === 0){ ed.rect = {x:0,y:0,w:ed.W,h:ed.H}; drawRect(); }
}
$('rotL').onclick = ()=>rotate(-90);
$('rotR').onclick = ()=>rotate(90);

/* drag to move / resize */
(function(){
  const box = $('cbox');
  let mode = null, handle = null, sx = 0, sy = 0, start = null;
  const pos = e => {
    const b = box.getBoundingClientRect();
    return { x: e.clientX - b.left, y: e.clientY - b.top };
  };
  box.addEventListener('pointerdown', e => {
    const h = e.target.closest('.hh');
    const inCrop = e.target.closest('.crop');
    if(!h && !inCrop) return;
    box.setPointerCapture(e.pointerId);
    const p = pos(e);
    sx = p.x; sy = p.y;
    start = { ...ed.rect };
    mode = h ? 'resize' : 'move';
    handle = h ? h.dataset.h : null;
    $('crop').classList.add('active');
    e.preventDefault();
  });
  box.addEventListener('pointermove', e => {
    if(!mode) return;
    const p = pos(e);
    if(mode === 'move'){
      ed.rect.x = start.x + (p.x - sx);
      ed.rect.y = start.y + (p.y - sy);
    }else{
      const ax = handle.includes('w') ? start.x + start.w : start.x;
      const ay = handle.includes('n') ? start.y + start.h : start.y;
      const px = Math.max(0, Math.min(ed.W, p.x));
      const py = Math.max(0, Math.min(ed.H, p.y));
      let w = Math.abs(px - ax), h = Math.abs(py - ay);
      const maxW = px > ax ? ed.W - ax : ax;
      const maxH = py > ay ? ed.H - ay : ay;
      if(ed.ar > 0 || ed.ar === -1){
        const ar = ed.ar === -1 ? ed.W/ed.H : ed.ar;
        if(w/h > ar) w = h*ar; else h = w/ar;
        if(w > maxW){ w = maxW; h = w/ar; }
        if(h > maxH){ h = maxH; w = h*ar; }
      }else{
        w = Math.min(w, maxW); h = Math.min(h, maxH);
      }
      w = Math.max(MINC, w); h = Math.max(MINC, h);
      ed.rect.w = w; ed.rect.h = h;
      ed.rect.x = px > ax ? ax : ax - w;
      ed.rect.y = py > ay ? ay : ay - h;
    }
    drawRect();
  });
  const end = e => {
    if(!mode) return;
    mode = null; handle = null;
    $('crop').classList.remove('active');
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
})();

$('eSave').onclick = async ()=>{
  const btn = $('eSave'); btn.textContent = 'Saving…'; btn.disabled = true;
  try{
    const e = effDims();
    const off = document.createElement('canvas');
    off.width = e.w; off.height = e.h;
    const oc = off.getContext('2d');
    oc.translate(e.w/2, e.h/2);
    oc.rotate(ed.rot * Math.PI/180);
    oc.drawImage(ed.img, -ed.img.width/2, -ed.img.height/2);

    const k = e.w / ed.W;                       // display px -> image px
    const r = ed.rect;
    const sw = r.w*k, sh = r.h*k;
    const out = document.createElement('canvas');
    const cap = Math.min(1, 1400/Math.max(sw,sh));
    out.width = Math.round(sw*cap); out.height = Math.round(sh*cap);
    out.getContext('2d').drawImage(off, r.x*k, r.y*k, sw, sh, 0, 0, out.width, out.height);

    const p = openPhotos[ed.i];
    if(!p.orig) p.orig = p.src;
    p.src = out.toDataURL('image/jpeg', .8);
    p.thumb = await makeThumb(p.src);
    p.edit = { rot:ed.rot, ar:ed.ar, rx:r.x/ed.W, ry:r.y/ed.H, rw:r.w/ed.W, rh:r.h/ed.H };
    await save(); drawDay();
  }catch(err){ console.error(err); alert('That edit could not be saved.'); }
  btn.textContent = 'Done'; btn.disabled = false;
  closeEditor();
};

window.addEventListener('resize', ()=>{
  if($('editor').hidden || !ed.img) return;
  const rx = ed.rect.x/ed.W, ry = ed.rect.y/ed.H, rw = ed.rect.w/ed.W, rh = ed.rect.h/ed.H;
  layout();
  ed.rect = { x:rx*ed.W, y:ry*ed.H, w:rw*ed.W, h:rh*ed.H };
  drawRect();
});

/* ---------- add photos ---------- */
$('addBtn').onclick = ()=> $('file').click();
$('addNoteBtn').onclick = async ()=>{
  openPhotos.push({ src:null, orig:null, thumb:null, note:'', meal:null, time:'', timeType:'vague' });
  await save(); drawDay();
};
$('file').onchange = async e => {
  const files = [...e.target.files]; e.target.value='';
  if(!files.length) return;
  const btn = $('addBtn'); btn.classList.add('busy'); btn.textContent = 'Working…';
  pill(files.length > 1 ? `Adding ${files.length} photos…` : 'Adding photo…', true);
  for(const f of files){
    try{
      const img = await loadImg(await fileToDataURL(f));
      const src = downscale(img, 1400, .78);
      const now = new Date();
      openPhotos.push({ src, orig:src, thumb: await makeThumb(src), note:'', meal:null,
        time:`${pad(now.getHours())}:${pad(now.getMinutes())}`, timeType:'detail' });
    }catch(err){ console.error(err); }
  }
  openPhotos.sort(byTime);
  await save();
  drawDay();
  btn.classList.remove('busy'); btn.textContent = '＋ Add photo';
};

/* ---------- backup ---------- */
$('exportBtn').onclick = async ()=>{
  const keys = (await store.keys()).filter(k => String(k).startsWith('day:'));
  const data = {};
  for(const k of keys) data[k] = await store.get(k);
  const blob = new Blob([JSON.stringify({v:1, saved:new Date().toISOString(), data})],
                        {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `meals-backup-${key(new Date())}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
};
$('importBtn').onclick = ()=> $('restore').click();
$('restore').onchange = e => {
  const f = e.target.files[0]; e.target.value='';
  if(!f) return;
  const fr = new FileReader();
  fr.onload = async ()=>{
    try{
      const parsed = JSON.parse(fr.result);
      const entries = Object.entries(parsed.data || {});
      if(!entries.length) return alert('No entries found in that file.');
      if(!confirm(`Restore ${entries.length} days? Days already logged here will be replaced.`)) return;
      const months = new Set();
      for(const [k, photos] of entries){
        await store.set(k, photos);
        months.add(k.slice(4,11));
      }
      for(const mp of months){
        const [y,m] = mp.split('-');
        await reconcile(`month:${y}-${m}`, (await store.get(`month:${y}-${m}`)) || {});
      }
      pill('Restored');
      loadMonth();
    }catch(err){ alert('That file could not be read.'); }
  };
  fr.readAsText(f);
};

$('prev').onclick = ()=>{ view.setMonth(view.getMonth()-1); loadMonth(); };
$('next').onclick = ()=>{ view.setMonth(view.getMonth()+1); loadMonth(); };
$('back').onclick = ()=>{
  $('sheet').hidden = true; $('cal').hidden = false;
  $('addBtn').hidden = true; openDay = null; window.scrollTo(0,0);
};

$('mode').textContent = `Saved on ${backend}`;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(() => console.log('Meals service worker registered'))
    .catch(() => {});
}
loadMonth();
</script>
